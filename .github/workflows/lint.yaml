name: Lint

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/lint.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/lint.yaml'

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"
