name: Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'vitest.config.ts'
      - '.github/workflows/test.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'vitest.config.ts'
      - '.github/workflows/test.yaml'

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vitest-coverage:
    name: Vitest with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      # Upload token: https://app.codecov.io/gh/display-protocol/dp1-publisher/settings (repo secret CODECOV_TOKEN)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

      - name: Add coverage summary to job summary
        run: |
          if [[ ! -f coverage/coverage-summary.json ]]; then
            echo "::error::coverage/coverage-summary.json not found (Vitest json-summary reporter)."
            exit 1
          fi
          {
            echo '## Vitest coverage (v8)'
            echo ''
            jq -r '.total | "### Totals\n\n| Metric | Coverage | Covered | Total |\n|--------|---------:|--------:|------:|\n| **Lines** | \(.lines.pct)% | \(.lines.covered) | \(.lines.total) |\n| **Statements** | \(.statements.pct)% | \(.statements.covered) | \(.statements.total) |\n| **Branches** | \(.branches.pct)% | \(.branches.covered) | \(.branches.total) |\n| **Functions** | \(.functions.pct)% | \(.functions.covered) | \(.functions.total) |"' coverage/coverage-summary.json
            echo ''
            echo '_HTML and LCOV are attached as a workflow artifact (`coverage-report`)._'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
          if-no-files-found: error
